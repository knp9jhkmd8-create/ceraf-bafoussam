# ============================================================================
#  CERAF Bafoussam — configuration du Worker Cloudflare
#
#  Ce Worker n'héberge QUE l'API. Le frontend reste sur GitHub Pages : le
#  déplacer changerait l'URL de la PWA déjà installée sur les téléphones de
#  l'équipe et casserait leur installation, pour aucun gain.
# ============================================================================

name = "ceraf-bafoussam-api"
main = "src/worker.mjs"
compatibility_date = "2026-08-06"

# Indispensable : le cœur utilise `crypto.subtle` et les APIs Web standard.
# Sans ce drapeau, certaines d'entre elles ne sont pas exposées à l'isolat.
compatibility_flags = ["nodejs_compat"]

# ── Report quotidien, au changement de jour ─────────────────────────────────
# 23:00 UTC = 00h00 au Cameroun (UTC+1). Le report se fait donc juste après le
# début de chaque nouvelle journée, ce qui est bien sa raison d'être.
#
# ⚠️ Les Cron Triggers Cloudflare sont TOUJOURS exprimés en UTC. Écrire
# « 0 0 » ici déclencherait à 1h du matin locale, pas à minuit.
#
# `getByDate` appelle la même fonction en filet de sécurité à la première
# ouverture de l'app : même si ce déclencheur venait à sauter, l'arriéré
# remonterait dès qu'un technicien ouvre sa fiche.
[triggers]
crons = ["0 23 * * *"]

# ── Secret ──────────────────────────────────────────────────────────────────
# DATABASE_URL n'est PAS déclarée ici : ce fichier est versionné dans un dépôt
# PUBLIC. Elle se pose en secret, hors du dépôt :
#
#   wrangler secret put DATABASE_URL
#
# (voir cloudflare/README.md)

# ── Stockage des sauvegardes automatiques ───────────────────────────────────
# Workers KV, offre gratuite : 1 Go, 1000 ecritures/jour. On en fait UNE par
# nuit, d'environ 250 Ko. Les entrees portent une date d'expiration posee a
# l'ecriture, donc aucune purge a coder ni a surveiller.
#
# L'identifiant d'un espace KV n'est PAS un secret : il ne donne acces a rien
# sans les jetons du compte Cloudflare. Il peut rester dans ce depot public.
[[kv_namespaces]]
binding = "SAUVEGARDES"
id = "5c8fa18eaa054f409311cf0482e2d833"
